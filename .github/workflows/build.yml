name: Build ImageToVoiceV2 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Android APK V2
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Find and extract V2 ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="./ImageToVoiceV2_Free_RJ_JVM17_FIXED_CONTEXT_FIX.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: Required V2 ZIP not found: $ZIP_FILE"
            echo "Available ZIP files:"
            find . -type f -iname '*.zip' ! -path './.git/*'
            exit 1
          fi

          echo "Selected final V2 ZIP: $ZIP_FILE"

          mkdir -p extracted
          unzip -q "$ZIP_FILE" -d extracted

          echo "Searching for Android project files..."
          find extracted -type f \
            \( -name 'settings.gradle' \
            -o -name 'settings.gradle.kts' \
            -o -name 'build.gradle' \
            -o -name 'build.gradle.kts' \) -print

      - name: Locate Android project
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t PROJECTS < <(
            find extracted -type f \
              \( -name 'settings.gradle' \
              -o -name 'settings.gradle.kts' \) \
              -printf '%h\n' | sort
          )

          if [ "${#PROJECTS[@]}" -eq 0 ]; then
            echo "ERROR: No settings.gradle file found."
            exit 1
          fi

          if [ "${#PROJECTS[@]}" -gt 1 ]; then
            echo "ERROR: Multiple Android projects found:"
            printf '%s\n' "${PROJECTS[@]}"
            exit 1
          fi

          PROJECT_DIR="${PROJECTS[0]}"

          if [ ! -d "$PROJECT_DIR/app" ]; then
            echo "ERROR: Android app directory missing."
            exit 1
          fi

          echo "Android project: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          ls -la "$PROJECT_DIR"

      - name: Configure Java and Kotlin JVM target 17
        shell: bash
        run: |
          set -euo pipefail

          FILE="$PROJECT_DIR/app/build.gradle.kts"

          if [ ! -f "$FILE" ]; then
            echo "ERROR: $FILE not found."
            exit 1
          fi

          python3 - "$FILE" <<'PY'
          import pathlib
          import re
          import sys

          path = pathlib.Path(sys.argv[1])
          text = path.read_text()

          text = text.replace(
              'JavaVersion.VERSION_1_8',
              'JavaVersion.VERSION_17'
          )

          text = re.sub(
              r'(jvmTarget\s*=\s*["\'])1\.8(["\'])',
              r'\g<1>17\2',
              text
          )

          android_match = re.search(r'\bandroid\s*\{', text)

          if not android_match:
              raise SystemExit('ERROR: android block not found.')

          options_match = re.search(r'\bcompileOptions\s*\{', text)

          if options_match:
              start = options_match.end()
              depth = 1
              i = start

              while i < len(text) and depth:
                  if text[i] == '{':
                      depth += 1
                  elif text[i] == '}':
                      depth -= 1
                  i += 1

              if depth != 0:
                  raise SystemExit('ERROR: Invalid compileOptions block.')

              body = text[start:i-1]

              for key in ('sourceCompatibility', 'targetCompatibility'):
                  pattern = rf'\b{key}\s*=\s*JavaVersion\.\w+'
                  replacement = f'{key} = JavaVersion.VERSION_17'

                  if re.search(pattern, body):
                      body = re.sub(pattern, replacement, body)
                  else:
                      body += f'\n        {replacement}\n'

              text = text[:start] + body + text[i-1:]

          else:
              insert_at = android_match.end()
              block = """
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
          """
              text = text[:insert_at] + block + text[insert_at:]

          path.write_text(text)
          print('Java compatibility configured for JVM 17.')
          PY

      - name: Check Android project
        shell: bash
        run: |
          set -euo pipefail

          test -d "$PROJECT_DIR/app"

          if [ ! -f "$PROJECT_DIR/build.gradle.kts" ] \
             && [ ! -f "$PROJECT_DIR/build.gradle" ]; then
            echo "ERROR: Root Gradle build file missing."
            exit 1
          fi

          echo "Android project structure OK."

      - name: Build Debug APK
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew clean assembleDebug --stacktrace
          else
            echo "gradlew not found; using installed Gradle."
            gradle clean assembleDebug --stacktrace
          fi

      - name: Find APK
        shell: bash
        run: |
          set -euo pipefail

          APK_DIR="$PROJECT_DIR/app/build/outputs/apk/debug"

          if [ ! -d "$APK_DIR" ]; then
            echo "ERROR: APK output directory not found."
            exit 1
          fi

          find "$APK_DIR" -type f -name '*.apk' -print

          if ! find "$APK_DIR" -type f -name '*.apk' \
            -print -quit | grep -q .; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ImageToVoiceV2-Free-RJ-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
