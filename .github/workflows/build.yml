name: Build ImageToVoiceV2 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Android APK V2
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Find and extract V2 ZIP
        shell: bash
        run: |
          set -e

          echo "Searching for ImageToVoice V2 ZIP..."

          ZIP_FILE=$(find . -maxdepth 2 -type f \
            \( -iname "*ImageToVoiceV2*.zip" -o -iname "*V2*RJ*.zip" \) \
            | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: ImageToVoice V2 ZIP not found."
            echo "ZIP files found:"
            find . -type f -name "*.zip"
            exit 1
          fi

          echo "Found ZIP: $ZIP_FILE"

          mkdir -p extracted
          unzip -q "$ZIP_FILE" -d extracted

          echo "Extracted files:"
          find extracted -maxdepth 3 -type f | head -100

      - name: Locate Android project
        shell: bash
        run: |
          set -e

          PROJECT_DIR=$(find extracted -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            -printf '%h\n' | head -n 1)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android project not found."
            find extracted -maxdepth 5 -type f
            exit 1
          fi

          echo "Android project found at:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

            - name: Locate Android project
        shell: bash
        run: |
          set -e

          PROJECT_DIR=$(find extracted -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            -printf '%h\n' | head -n 1)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android project not found."
            find extracted -maxdepth 5 -type f
            exit 1
          fi

          echo "Android project found at: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Project contents:"
          ls -la "$PROJECT_DIR"

      - name: Check Gradle wrapper
        shell: bash
        run: |
          set -e

          echo "Checking for Gradle wrapper..."

          find "$PROJECT_DIR" -maxdepth 2 -type f \
            \( -name "gradlew" -o -name "gradlew.bat" \) -print

      - name: Make Gradle executable
        shell: bash
        run: |
          set -e

          if [ ! -f "$PROJECT_DIR/gradlew" ]; then
            echo "gradlew not found in project."
            echo "Using system Gradle instead."
            exit 0
          fi

          chmod +x "$PROJECT_DIR/gradlew"

      - name: Build Debug APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          if [ -f "./gradlew" ]; then
            ./gradlew clean assembleDebug --stacktrace
          else
            gradle clean assembleDebug --stacktrace
          fi

      - name: Find APK
        shell: bash
        run: |
          echo "APK files:"
          find "$PROJECT_DIR" -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ImageToVoiceV2-Free-RJ-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
