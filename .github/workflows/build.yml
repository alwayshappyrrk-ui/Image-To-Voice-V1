name: Build ImageToVoiceV2 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Android APK V2
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Find and extract V2 ZIP
        shell: bash
        run: |
          set -euo pipefail

          echo "Searching for V2 ZIP..."

          mapfile -t ZIP_FILES < <(
            find . -type f -iname '*ImageToVoiceV2*.zip' \
              ! -path './.git/*' | sort
          )

          if [ "${#ZIP_FILES[@]}" -eq 0 ]; then
            echo "ERROR: No ImageToVoiceV2 ZIP found."
            find . -type f -iname '*.zip'
            exit 1
          fi

          if [ "${#ZIP_FILES[@]}" -gt 1 ]; then
            echo "ERROR: Multiple V2 ZIP files found:"
            printf '%s\n' "${ZIP_FILES[@]}"
            echo "Keep only the intended V2 ZIP in the repository."
            exit 1
          fi

          ZIP_FILE="${ZIP_FILES[0]}"
          echo "Selected ZIP: $ZIP_FILE"

          mkdir -p extracted
          unzip -q "$ZIP_FILE" -d extracted

          echo "Gradle files found:"
          find extracted -type f \
            \( -name 'settings.gradle' \
            -o -name 'settings.gradle.kts' \
            -o -name 'build.gradle' \
            -o -name 'build.gradle.kts' \) -print

      - name: Locate Android project
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t PROJECTS < <(
            find extracted -type f \
              \( -name 'settings.gradle' \
              -o -name 'settings.gradle.kts' \) \
              -printf '%h\n' | sort
          )

          if [ "${#PROJECTS[@]}" -eq 0 ]; then
            echo "ERROR: No Android settings.gradle file found."
            exit 1
          fi

          if [ "${#PROJECTS[@]}" -gt 1 ]; then
            echo "ERROR: Multiple Android projects found:"
            printf '%s\n' "${PROJECTS[@]}"
            exit 1
          fi

          PROJECT_DIR="${PROJECTS[0]}"

          if [ ! -d "$PROJECT_DIR/app" ]; then
            echo "ERROR: app directory missing."
            exit 1
          fi

          echo "Android project: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          ls -la "$PROJECT_DIR"

      - name: Configure Java and Kotlin JVM target 17
        shell: bash
        run: |
          set -euo pipefail

          FILE="$PROJECT_DIR/app/build.gradle.kts"

          if [ ! -f "$FILE" ]; then
            echo "ERROR: $FILE not found."
            find "$PROJECT_DIR/app" -maxdepth 2 \
              -type f -name 'build.gradle*' -print
            exit 1
          fi

          echo "Original app Gradle file:"
          cat "$FILE"

          python3 - "$FILE" <<'PY'
          import pathlib
          import re
          import sys

          path = pathlib.Path(sys.argv[1])
          text = path.read_text()

          # Fix explicit Java 1.8 compatibility settings.
          text = text.replace(
              'JavaVersion.VERSION_1_8',
              'JavaVersion.VERSION_17'
          )

          # Fix explicit Kotlin JVM targets.
          text = re.sub(
              r'(jvmTarget\s*=\s*["\'])1\.8(["\'])',
              r'\g<1>17\2',
              text
          )

          # Ensure Android Java compatibility is explicitly set to 17.
          android_match = re.search(r'\bandroid\s*\{', text)

          if not android_match:
              raise SystemExit(
                  'ERROR: android { } block not found.'
              )

          options_match = re.search(
              r'\bcompileOptions\s*\{',
              text
          )

          if options_match:
              start = options_match.end()
              depth = 1
              i = start

              while i < len(text) and depth:
                  if text[i] == '{':
                      depth += 1
                  elif text[i] == '}':
                      depth -= 1
                  i += 1

              if depth != 0:
                  raise SystemExit(
                      'ERROR: Could not parse compileOptions block.'
                  )

              body = text[start:i-1]

              if re.search(r'\bsourceCompatibility\s*=', body):
                  body = re.sub(
                      r'sourceCompatibility\s*=\s*JavaVersion\.\w+',
                      'sourceCompatibility = JavaVersion.VERSION_17',
                      body
                  )
              else:
                  body += (
                      '\n        sourceCompatibility = '
                      'JavaVersion.VERSION_17\n'
                  )

              if re.search(r'\btargetCompatibility\s*=', body):
                  body = re.sub(
                      r'targetCompatibility\s*=\s*JavaVersion\.\w+',
                      'targetCompatibility = JavaVersion.VERSION_17',
                      body
                  )
              else:
                  body += (
                      '\n        targetCompatibility = '
                      'JavaVersion.VERSION_17\n'
                  )

              text = text[:start] + body + text[i-1:]

          else:
              insert_at = android_match.end()

              text = (
                  text[:insert_at]
                  + '\n    compileOptions {\n'
                    '        sourceCompatibility = '
                    'JavaVersion.VERSION_17\n'
                    '        targetCompatibility = '
                    'JavaVersion.VERSION_17\n'
                    '    }\n'
                  + text[insert_at:]
              )

          path.write_text(text)

          print('\nUpdated app/build.gradle.kts:')
          print(text)
          PY

          echo "Checking remaining JVM 1.8 settings:"
          grep -RInE \
            'VERSION_1_8|jvmTarget.*1\.8|sourceCompatibility.*1\.8|targetCompatibility.*1\.8' \
            "$PROJECT_DIR" \
            --include='*.gradle' \
            --include='*.gradle.kts' || true

      - name: Check Android project
        shell: bash
        run: |
          set -euo pipefail

          test -f "$PROJECT_DIR/settings.gradle" \
            || test -f "$PROJECT_DIR/settings.gradle.kts"

          test -f "$PROJECT_DIR/build.gradle" \
            || test -f "$PROJECT_DIR/build.gradle.kts"

          test -d "$PROJECT_DIR/app"

          echo "Android project structure OK."

      - name: Build Debug APK
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew clean assembleDebug --stacktrace
          else
            echo "gradlew not found; using installed Gradle."
            gradle clean assembleDebug --stacktrace
          fi

      - name: Find APK
        shell: bash
        run: |
          set -euo pipefail

          APK_DIR="$PROJECT_DIR/app/build/outputs/apk/debug"

          echo "Generated APK files:"
          find "$APK_DIR" -type f -name '*.apk' -print

          if ! find "$APK_DIR" -type f -name '*.apk' \
            -print -quit | grep -q .; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ImageToVoiceV2-Free-RJ-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
