name: Build ImageToVoiceV1 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Android project ZIP
        run: |
          mkdir -p extracted
          unzip -o "ImageToVoiceV1_Project.zip" -d extracted

      - name: Find Android project
        run: |
          echo "Searching for Android Gradle project..."

          find extracted -type f \( \
            -name "settings.gradle.kts" -o \
            -name "settings.gradle" \
          \)

      - name: Set Android project directory
        run: |
          PROJECT_DIR=$(dirname "$(find extracted -type f \( \
            -name "settings.gradle.kts" -o \
            -name "settings.gradle" \
          \) | head -n 1)")

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android Gradle project not found."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Android project found at: $PROJECT_DIR"

      - name: Configure app JVM target
        run: |
          cd "$PROJECT_DIR"

          echo "Original app/build.gradle.kts:"
          cat app/build.gradle.kts

          cat >> app/build.gradle.kts <<'EOF'

          // CI JVM compatibility fix
          android {
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
          }

          tasks.withType<org.jetbrains.kotlin.gradle.tasks.KotlinCompile>().configureEach {
              kotlinOptions {
                  jvmTarget = "17"
              }
          }
          EOF

          echo "JVM 17 configuration added to app module."

          echo "Updated app/build.gradle.kts:"
          cat app/build.gradle.kts

      - name: Build Debug APK
        run: |
          cd "$PROJECT_DIR"

          echo "Project directory:"
          pwd

          echo "Java version:"
          java -version

          echo "Gradle version:"
          gradle --version

          echo "Building APK..."

          gradle clean assembleDebug --stacktrace

      - name: Find APK
        run: |
          echo "Searching for generated APK..."
          find "$PROJECT_DIR" -type f -name "*.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ImageToVoiceV1-APK
          path: '**/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
