name: Build ImageToVoiceV2 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Android APK V2
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Find and extract V2 ZIP
        shell: bash
        run: |
          set -e

          echo "Searching for ImageToVoice V2 ZIP..."

          ZIP_FILE=$(find . -type f -iname "*ImageToVoiceV2*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: ImageToVoice V2 ZIP not found."
            echo "ZIP files found:"
            find . -type f -name "*.zip"
            exit 1
          fi

          echo "Found: $ZIP_FILE"

          mkdir -p extracted
          unzip -q "$ZIP_FILE" -d extracted

          echo "Extracted structure:"
          find extracted -maxdepth 4 -type f | sort

      - name: Locate Android project
        shell: bash
        run: |
          set -e

          PROJECT_DIR=$(find extracted -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            -printf '%h\n' | head -n 1)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: settings.gradle not found."
            exit 1
          fi

          echo "Android project:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Project files:"
          ls -la "$PROJECT_DIR"

      - name: Check Android project
        shell: bash
        run: |
          set -e

          test -f "$PROJECT_DIR/settings.gradle" \
            || test -f "$PROJECT_DIR/settings.gradle.kts"

          test -f "$PROJECT_DIR/build.gradle" \
            || test -f "$PROJECT_DIR/build.gradle.kts"

          test -d "$PROJECT_DIR/app"

          echo "Android project structure OK."

      - name: Build Debug APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          if [ -f "gradlew" ]; then
            chmod +x gradlew
            ./gradlew clean assembleDebug --stacktrace
          else
            echo "gradlew not found."
            echo "Using installed Gradle..."
            gradle clean assembleDebug --stacktrace
          fi

      - name: Find APK
        shell: bash
        run: |
          echo "Generated APK files:"
          find "$PROJECT_DIR" -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ImageToVoiceV2-Free-RJ-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
